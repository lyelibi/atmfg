[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atmfg"
version = "1.0.0"
description = "Approximate Triangulated Maximally Filtered Graphs (a-TMFG) for large datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lionel Yelibi" }]
keywords = ["TMFG", "filtered graph", "correlation network", "planar graph", "HNSW", "kNN graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
    "hnswlib>=0.8",
]

[project.optional-dependencies]
progress = ["tqdm"]
networkx = ["networkx>=3.0"]
dev = ["pytest>=7", "networkx>=3.0", "tqdm"]

[project.urls]
Paper = "https://arxiv.org/abs/2603.09564"
Repository = "https://github.com/lyelibi/atmfg"

[tool.setuptools.packages.find]
include = ["atmfg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
